<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Health Cross / Protective Shield Emblem -->
  <g transform="translate(256, 256)">
    <!-- White Circle Backdrop -->
    <circle r="180" fill="#ffffff" opacity="0.96"/>
    
    <!-- Red Cross Center -->
    <path d="M-40 -120 H40 V-40 H120 V40 H40 V120 H-40 V40 H-120 V-40 H-40 Z" fill="#b91c1c" rx="8"/>
    
    <!-- Heart & Maternal Care Icon -->
    <path d="M0 -30 C-30 -70 -85 -50 -85 0 C-85 45 0 85 0 85 C0 85 85 45 85 0 C85 -50 30 -70 0 -30 Z" fill="#fef2f2" stroke="#b91c1c" stroke-width="8"/>
    
    <!-- Mother & Child Silhouette inside Heart -->
    <circle cx="-16" cy="-8" r="14" fill="#b91c1c"/>
    <circle cx="16" cy="4" r="10" fill="#f59e0b"/>
    <path d="M-32 30 C-32 12 -2 12 -2 30 Z" fill="#b91c1c"/>
    <path d="M2 30 C2 16 30 16 30 30 Z" fill="#f59e0b"/>
  </g>
</svg>
